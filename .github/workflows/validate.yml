name: Validate DevOps Project

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python and Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Python syntax
        run: python3 -m py_compile python-health-check/health_check.py

      - name: Validate JSON
        run: python3 -m json.tool python-health-check/services.json > /dev/null

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=terraform-health-config init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform-health-config validate
